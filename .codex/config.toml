#:schema https://developers.openai.com/codex/config-schema.json

# Project-scoped Codex defaults. Codex loads this file only after the repository
# is trusted. Keep credentials and machine-specific provider settings in
# ~/.codex/config.toml, never here.
[agents]
max_threads = 4
max_depth = 1

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

# TypeSafe Jev — secrets in D:/Projects/jev-mcp/.env (JEV_ENV_FILE); paid API per tool call.
[mcp_servers.jev-rw-systemone]
command = "uv"
args = ["run", "--project", "D:/Projects/jev-mcp", "python", "D:/Projects/jev-mcp/scripts/run_jev_mcp.py"]

[mcp_servers.jev-rw-systemone.env]
JEV_ENV_FILE = "D:/Projects/jev-mcp/.env"
JEV_MODEL = "jev-1.13.0"

[mcp_servers."llmwiki-ro-core"]
command = "uv"
args = ["run", "--project", "D:/Projects/synthet-llm-wiki", "python", "D:/Projects/synthet-llm-wiki/scripts/run_llmwiki_mcp.py"]

# Pipeline search/resolve/execute entry point (image-scoring-pipeline docs/technical/VEXLUM_MCP.md).
# Build first: cd image-scoring-pipeline/mcp-server && npm ci && npm run build.
# execute can run pipeline actions; destructive ones also need VEXLUM_ALLOW_ELEVATED=1 in an env table here.
[mcp_servers.vexlum]
command = "node"
args = ["D:/Projects/image-scoring-pipeline/mcp-server/dist/vexlum.js"]
cwd = "D:/Projects/image-scoring-pipeline"
startup_timeout_sec = 30
tool_timeout_sec = 120

# Gallery search/resolve/execute entry point (image-scoring-gallery docs/technical/DRIFTARA_MCP.md).
# Build first: cd image-scoring-gallery/mcp-server && npm ci && npm run build.
# execute can run gallery actions; ipc.* and live.* need the gallery app running, and destructive
# ones also need DRIFTARA_ALLOW_ELEVATED=1 in the app's environment.
[mcp_servers.driftara]
command = "node"
args = ["D:/Projects/image-scoring-gallery/mcp-server/dist/driftara.js"]
cwd = "D:/Projects/image-scoring-gallery"
startup_timeout_sec = 30
tool_timeout_sec = 120
